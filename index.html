<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Undangan Lamaran · Eky &amp; Tata</title>
  <meta name="description" content="Undangan lamaran Eky &amp; Tata — Sabtu, 10 Oktober 2026 di Rumah Tata.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#FBF6EF">
  <meta name="color-scheme" content="light">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Undangan Lamaran Eky &amp; Tata">
  <meta property="og:description" content="Sabtu, 10 Oktober 2026 · Rumah Tata">

  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Plus+Jakarta+Sans:wght@400;500;600&amp;display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/main.js" defer></script>
</head>
<body class="is-loading">
  <div class="backdrop" aria-hidden="true"><span></span><span></span><span></span></div>

  <div class="loader" role="status" aria-label="Memuat undangan">
    <svg class="loader__rings" viewBox="0 0 64 40" aria-hidden="true">
      <circle cx="24" cy="20" r="14" /><circle cx="40" cy="20" r="14" />
    </svg>
  </div>

  <div id="app"></div>

  <noscript>
    <style>.loader { display: none; }</style>
    <p class="noscript">Mohon aktifkan JavaScript untuk membuka undangan ini.</p>
  </noscript>

  <!-- ============ Tampilan jika kode akses tidak sesuai ============ -->
  <template id="tpl-denied">
    <main class="denied" aria-labelledby="denied-title">
      <div class="denied__card">
        <div data-anim style="--i:0">
          <img class="denied__art" src="assets/img/envelope-locked.svg" alt="" width="280" height="230">
        </div>
        <h1 class="denied__title" id="denied-title" data-anim style="--i:1">Maaf, Anda tidak memiliki akses ke undangan ini.</h1>
        <p class="denied__hint" data-anim style="--i:2">Undangan ini bersifat pribadi. Jika Anda merasa diundang, pastikan membuka tautan lengkap yang dikirimkan kepada Anda.</p>
      </div>
    </main>
  </template>

  <!-- ============ Sampul undangan ============ -->
  <template id="tpl-cover">
    <section class="cover" aria-labelledby="cover-title">
      <div class="cover__decor" aria-hidden="true">
        <img class="cover__flora cover__flora--top" src="assets/img/floral-corner.svg" alt="" width="320" height="320">
        <img class="cover__flora cover__flora--bottom" src="assets/img/floral-corner.svg" alt="" width="320" height="320">
      </div>

      <div class="cover__inner">
        <p class="eyebrow" data-anim style="--i:0">Undangan Lamaran</p>
        <h1 class="cover__names" id="cover-title" data-anim style="--i:1">Eky <span class="amp">&amp;</span> Tata</h1>
        <p class="cover__date" data-anim style="--i:2" data-field="dateLong"></p>

        <div class="envelope" data-anim style="--i:3" aria-hidden="true">
          <div class="envelope__body">
            <div class="envelope__back"></div>
            <div class="envelope__letter">
              <span class="envelope__mono">E<i>&amp;</i>T</span>
              <span class="envelope__line"></span>
              <span class="envelope__small" data-field="dateDots"></span>
            </div>
            <div class="envelope__front"></div>
            <div class="envelope__flap"></div>
            <div class="envelope__seal"><span>E<i>&amp;</i>T</span></div>
          </div>
        </div>

        <p class="cover__to" data-anim style="--i:4">Teruntuk</p>
        <p class="cover__guest" data-anim style="--i:5" data-field="guest"></p>

        <div class="cover__action" data-anim style="--i:6">
          <button class="btn btn--primary" type="button" data-action="open">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.2 8.4c.5.38.8.97.8 1.6v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V10a2 2 0 0 1 .8-1.6l8-6a2 2 0 0 1 2.4 0l8 6Z" /><path d="m22 10-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 10" /></svg>
            Buka Undangan
          </button>
        </div>
      </div>
    </section>
  </template>

  <!-- ============ Isi undangan ============ -->
  <template id="tpl-invitation">
    <main class="invitation" id="undangan" hidden>

      <!-- Sambutan -->
      <section class="section hero" aria-labelledby="hero-title">
        <div class="container hero__grid">
          <figure class="hero__art" data-reveal="zoom" style="--d:.1s">
            <img src="assets/img/hero-rings.svg" alt="Ilustrasi sepasang cincin di atas rangkaian bunga" width="480" height="480">
          </figure>
          <div class="hero__text">
            <h1 class="hero__title" id="hero-title" tabindex="-1">
              <span class="hero__hello" data-reveal style="--d:.25s">Selamat datang</span>
              <span class="hero__guest" data-reveal style="--d:.4s"><span data-field="guest"></span>!</span>
            </h1>
            <p class="hero__lead" data-reveal style="--d:.55s">Kami sangat senang mengundang Anda ke acara lamaran Eky dan Tata.</p>
            <p class="pill" data-reveal style="--d:.7s">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" /><path d="M16 2v4M8 2v4M3 10h18" /></svg>
              <span data-field="dateLong"></span>
            </p>
          </div>
        </div>
        <a class="scroll-hint" href="#pasangan" data-reveal style="--d:1s">
          <span>Gulir</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
        </a>
      </section>

      <!-- Pasangan -->
      <section class="section couple" id="pasangan" aria-labelledby="couple-title">
        <div class="container">
          <header class="section-head" data-reveal>
            <p class="eyebrow">Yang Berbahagia</p>
            <h2 class="section-title" id="couple-title">Dua Hati, Satu Cerita</h2>
            <img class="ornament" src="assets/img/sprig.svg" alt="" width="120" height="32">
            <p class="section-lead">Dengan penuh rasa syukur, kami bermaksud melangkah ke jenjang yang lebih serius. Izinkan kami berbagi kebahagiaan ini bersama <span data-field="guest"></span>.</p>
          </header>

          <div class="couple__grid">
            <article class="person" data-reveal="left">
              <div class="person__frame">
                <img src="assets/img/arch-frame.svg" alt="" width="260" height="340">
                <span class="person__initial" aria-hidden="true">E</span>
              </div>
              <h3 class="person__nick">Eky</h3>
              <p class="person__name">Sallie Trixie Zebada Mansurina</p>
            </article>

            <div class="couple__amp" data-reveal="zoom" style="--d:.25s" aria-hidden="true">&amp;</div>

            <article class="person" data-reveal="right" style="--d:.1s">
              <div class="person__frame person__frame--mirror">
                <img src="assets/img/arch-frame.svg" alt="" width="260" height="340">
                <span class="person__initial" aria-hidden="true">T</span>
              </div>
              <h3 class="person__nick">Tata</h3>
              <p class="person__name">Nurul Sasmitha</p>
            </article>
          </div>
        </div>
      </section>

      <!-- Acara -->
      <section class="section event" id="acara" aria-labelledby="event-title">
        <div class="container">
          <div class="event__panel">
            <header class="section-head" data-reveal>
              <p class="eyebrow">Save the Date</p>
              <h2 class="section-title" id="event-title">Acara Lamaran</h2>
              <img class="ornament" src="assets/img/sprig.svg" alt="" width="120" height="32">
            </header>

            <p class="date-display" data-reveal="zoom">
              <span class="date-display__side" data-field="weekday"></span>
              <span class="date-display__day" data-field="day"></span>
              <span class="date-display__side"><span data-field="month"></span><br><span data-field="year"></span></span>
            </p>

            <div class="event__grid">
              <div class="card event__card" data-reveal>
                <ul class="details">
                  <li class="details__item">
                    <span class="details__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" /><path d="M16 2v4M8 2v4M3 10h18" /></svg></span>
                    <div>
                      <p class="details__label">Hari &amp; Tanggal</p>
                      <p class="details__value" data-field="dateLong"></p>
                    </div>
                  </li>
                  <li class="details__item" data-requires="timeLabel">
                    <span class="details__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" /><path d="M12 6v6l4 2" /></svg></span>
                    <div>
                      <p class="details__label">Waktu</p>
                      <p class="details__value" data-field="timeLabel"></p>
                    </div>
                  </li>
                  <li class="details__item">
                    <span class="details__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5" /><path d="M5 9v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9" /><path d="M12 17.5s-3-1.9-3-3.9a1.6 1.6 0 0 1 3-.8 1.6 1.6 0 0 1 3 .8c0 2-3 3.9-3 3.9Z" /></svg></span>
                    <div>
                      <p class="details__label">Tempat</p>
                      <p class="details__value" data-field="place"></p>
                      <p class="details__note" data-field="address" data-requires="address"></p>
                    </div>
                  </li>
                </ul>
                <div class="event__actions">
                  <a class="btn btn--primary" data-link="calendar" href="#" target="_blank" rel="noopener">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" /><path d="M16 2v4M8 2v4M3 10h18M12 13.5v5M9.5 16h5" /></svg>
                    Simpan ke Kalender
                  </a>
                  <a class="btn btn--soft" data-link="maps" data-requires="mapsUrl" href="#" target="_blank" rel="noopener">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" /><circle cx="12" cy="10" r="3" /></svg>
                    Petunjuk Arah
                  </a>
                </div>
              </div>

              <div class="card countdown" data-reveal style="--d:.15s">
                <p class="countdown__label">Menuju hari bahagia</p>
                <div class="countdown__grid" role="timer" aria-label="Hitung mundur menuju acara">
                  <div class="countdown__unit"><span class="countdown__num" data-unit="days">00</span><span class="countdown__name">Hari</span></div>
                  <div class="countdown__unit"><span class="countdown__num" data-unit="hours">00</span><span class="countdown__name">Jam</span></div>
                  <div class="countdown__unit"><span class="countdown__num" data-unit="minutes">00</span><span class="countdown__name">Menit</span></div>
                  <div class="countdown__unit"><span class="countdown__num" data-unit="seconds">00</span><span class="countdown__name">Detik</span></div>
                </div>
                <p class="countdown__done" hidden></p>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Penutup -->
      <section class="section closing" id="penutup" aria-labelledby="closing-title">
        <div class="container closing__inner">
          <img class="closing__art" src="assets/img/lovebirds.svg" alt="Ilustrasi sepasang burung cinta di dahan berbunga" width="400" height="280" data-reveal="zoom">
          <h2 class="section-title" id="closing-title" data-reveal>Sampai Jumpa di Hari Bahagia</h2>
          <p class="closing__text" data-reveal style="--d:.1s">Merupakan suatu kebahagiaan dan kehormatan bagi kami apabila <span data-field="guest"></span> berkenan hadir untuk memberikan doa restu.</p>
          <p class="closing__sign" data-reveal style="--d:.2s">
            <span class="closing__with">Dengan penuh cinta,</span>
            <span class="closing__names">Eky &amp; Tata</span>
          </p>
        </div>
      </section>

      <footer class="footer">
        <img class="ornament" src="assets/img/sprig.svg" alt="" width="120" height="32">
        <p>Undangan ini dibuat khusus untuk <span data-field="guest"></span>.</p>
        <p class="footer__date" data-field="dateDots"></p>
      </footer>
    </main>
  </template>
</body>
</html>
