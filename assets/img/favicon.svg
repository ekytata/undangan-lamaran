<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<style>.p1{fill:var(--c1,#FCE5EB);stroke:#fff;stroke-width:1;stroke-opacity:.9}
.p2{fill:var(--c2,#F7CCD7);stroke:#fff;stroke-width:.9;stroke-opacity:.75}
.p3{fill:var(--c3,#EEABBE);stroke:#fff;stroke-width:.7;stroke-opacity:.6}
.p4{fill:var(--c4,#CF7C95)}
.nos{stroke:none}
.r2{fill:none;stroke:var(--c3,#EEABBE);stroke-width:1.9;stroke-linecap:round}
.b1{fill:var(--c2,#F7CCD7);stroke:#fff;stroke-width:.8;stroke-opacity:.8}
.b4{fill:var(--c3,#EEABBE)}
.b2{fill:var(--c4,#CF7C95)}
.b3{fill:#E9C987}
.lf{fill:var(--l1,#AFC6AB)}
.lv{fill:none;stroke:var(--l2,#E4EDDF);stroke-width:1;stroke-linecap:round}
.eu{fill:var(--e1,#C8D9CD);stroke:var(--e2,#AEC5B7);stroke-width:.7}
.st{fill:none;stroke:var(--st,#A9BEA6);stroke-width:1.6;stroke-linecap:round}
