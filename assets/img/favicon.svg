.sp{fill:var(--s,#E2C38C)}
.bdy{fill:#C6DCEF}.bwg{fill:#A7C6E4}.bly{fill:#FFF9F2}.bbk{fill:#F2C29E}.bey{fill:#3F3540}.bck{fill:#F3B5C5}
.bfl{fill:none;stroke:#8DB2D7;stroke-width:1.3;stroke-linecap:round}
.bft{fill:none;stroke:#C7AD9C;stroke-width:2.2;stroke-linecap:round}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 3.6s ease-in-out infinite}
.fl{animation:fl 6s ease-in-out infinite}
.hb{animation:hb 3.2s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.3;transform:scale(.55)}50%{opacity:1;transform:scale(1)}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes hb{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.tw,.fl,.hb{animation:none}}</style>
